services:
  web:
    image: alphabloo7/s3-ilmu-pendidikan:latest
    container_name: s3-ilmu-pendidikan-web
    restart: always
    ports:
      - "8086:80" # Ubah port 8086 jika port tersebut sudah terpakai di server VPS Anda (misal: 8093)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
